<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
	<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
	<meta name="keywords" content="{% for tag in page.tags %}{{ tag }}, {% endfor %}{{ site.title }}" />
	<link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
	<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}" />
  	<link rel="stylesheet" type="text/css" href="{{ "/css/index.css" | prepend: site.baseurl }}">

	<!-- Favicon -->
	<link rel="shortcut icon" href="{{ site.baseurl }}/img/favicon.ico">

	<link rel="stylesheet" href="//unpkg.com/heti/umd/heti.min.css">
	<script>
		var _hmt = _hmt || [];
		(function() {
		  var hm = document.createElement("script");
		  hm.src = "https://hm.baidu.com/hm.js?f1362897495156d67e7ee51ac13a1a09";
		  var s = document.getElementsByTagName("script")[0]; 
		  s.parentNode.insertBefore(hm, s);
		})();
	</script>

	<!-- font-awesome -->
	<link rel="preconnect" href="https://cdn.jsdelivr.net">
	<link rel="preconnect" href="https://maxcdn.bootstrapcdn.com">
	<link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">

	<!-- 代码复制按钮 -->
	<script src="{{ '/js/copy-button.js' | prepend: site.baseurl }}" defer></script><!-- 代码复制按钮 -->
	<style>
	/* 关键CSS规则 */
	.body-wrapper, .nav-header { display: block; }
	</style>
</head>
